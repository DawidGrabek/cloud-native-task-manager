# Docker Compose for local development
version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: taskmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d taskmanager']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - taskmanager-network

  # Backend API
  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # target: production
    container_name: taskmanager-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: taskmanager
      DB_USER: admin
      DB_PASSWORD: password
      JWT_SECRET: your-super-secret-jwt-key-for-development
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro # For development hot reload
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - taskmanager-network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    ports:
      - '5173:80'
    depends_on:
      backend-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - taskmanager-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - taskmanager-network

  # Adminer for database management (development only)
  adminer:
    image: adminer:latest
    container_name: taskmanager-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: database
    networks:
      - taskmanager-network
    profiles:
      - development

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: taskmanager-prometheus
    restart: unless-stopped
    volumes:
      - ./docker-monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    networks:
      - taskmanager-network

  # Node Exporter — exposes host machine metrics (CPU, RAM, disk, network)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - '9100:9100'
    networks:
      - taskmanager-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: taskmanager-grafana
    restart: unless-stopped
    volumes:
      - ./docker-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - node-exporter
    networks:
      - taskmanager-network

  # Loki for log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: taskmanager-loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./docker-monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - taskmanager-network

  # Promtail for collecting Docker logs → Loki
  promtail:
    image: grafana/promtail:latest
    container_name: taskmanager-promtail
    restart: unless-stopped
    user: root
    volumes:
      - ./docker-monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - taskmanager-network

volumes:
  postgres_data:
    name: taskmanager_postgres_data
  redis_data:
    name: taskmanager_redis_data
  prometheus_data:
    name: taskmanager_prometheus_data
  grafana_data:
    name: taskmanager_grafana_data
  loki_data:
    name: taskmanager_loki_data

networks:
  taskmanager-network:
    name: taskmanager-network
    driver: bridge
