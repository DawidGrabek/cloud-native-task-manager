global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'taskmanager-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend-service:5000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
