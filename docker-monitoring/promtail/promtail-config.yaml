server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Docker wraps every log line in JSON: {"log":"...","stream":"stdout","time":"..."}
      - json:
          expressions:
            output: log
            stream: stream

      # If the extracted "output" is itself JSON (structured backend logs),
      # parse it to pull out "level" and "service" as Loki labels.
      - json:
          expressions:
            level: level
            service: service
          source: output

      # Promote level and service to labels so they can be used in LogQL selectors.
      - labels:
          stream:
          level:
          service:

      # Replace the Loki log line with the actual message, not the Docker wrapper JSON.
      - output:
          source: output
