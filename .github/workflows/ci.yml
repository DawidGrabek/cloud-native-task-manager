name: CI/CD Pipeline
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Conventional Commits
        uses: wagoid/commitlint-github-action@v6

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Backend - Install, Audit, Lint, Build & Test
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high || echo "Zignorowano bledy audytu (npm audit zwrócił błąd)"
          npx prettier --check . || echo "Błąd formatowania (Prettier), polecamy: npx prettier --write ."
          npm run lint
          npm run build
          npm test

      - name: Frontend - Install, Audit, Lint, Build & Test
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high || echo "Zignorowano bledy audytu (npm audit zwrócił błąd)"
          npx prettier --check . || echo "Błąd formatowania (Prettier), polecamy: npx prettier --write ."
          npm run lint
          npm run build
          npm test

  docker-build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:${{ github.sha }}
